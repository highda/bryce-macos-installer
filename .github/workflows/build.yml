name: Build

# Every push and pull request: build the Linux runtime and the app, and keep the
# disk image as a run artifact. Tags v*: also publish a GitHub Release.

on:
  push:
    branches: [main, v2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    name: Linux runtime (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Check the scripts
        run: |
          for f in vm/*.sh vm/guest/usr/local/bin/bryce-* vm/guest/usr/local/sbin/bryce-init; do
            head -1 "$f" | grep -q python || bash -n "$f"
          done
          python3 -m py_compile vm/guest/usr/local/bin/bryce-input

      - name: Build the runtime image
        run: vm/build-image.sh "$RUNNER_TEMP/runtime"

      - name: Pack it (root.img is sparse)
        run: tar -C "$RUNNER_TEMP/runtime" -czSf runtime.tar.gz Image root.img SOURCES.md packages.tsv

      - uses: actions/upload-artifact@v7
        with:
          name: runtime
          path: runtime.tar.gz
          compression-level: 0
          retention-days: 7

  app:
    name: Bryce 3D.app and disk image
    needs: runtime
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: runtime

      - name: Build the app and disk image
        run: |
          mkdir runtime && tar -C runtime -xzf runtime.tar.gz
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export BRYCE_VERSION="${GITHUB_REF_NAME#v}"
          else
            export BRYCE_VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          vm/build-app.sh runtime dist
          cp runtime/SOURCES.md runtime/packages.tsv dist/
          shasum -a 256 dist/Bryce-3D.dmg | sed 's| dist/| |' | tee dist/Bryce-3D.dmg.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Bryce-3D
          path: |
            dist/Bryce-3D.dmg
            dist/Bryce-3D.dmg.sha256
            dist/SOURCES.md
            dist/packages.tsv
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Bryce-3D.dmg dist/Bryce-3D.dmg.sha256 dist/SOURCES.md dist/packages.tsv \
            --title "Bryce 3D $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
